name: CI/CD

on:
  push:
    branches: [ "main" ]
permissions: 
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-assignment
    steps:
      - uses: actions/checkout@V4
      - uses: actions/setup-java@v4
        with:
          distribution: termium
          java-version: '17'
          cach: maven
          cache-dependency-path: java-assignment/pom.xml
      - name: Run tests
        run: ./mvnw -B -ntp verify
  publish-image:
    if: github.event_name == 'push' && github.ref == 'ref/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cach: maven
          cache-dependency-path: java-assignment/pom.xml
      - name: Package application
        working-directory: java-assignment
        run: ./mvnw -B -ntp package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: java-assignment
          file: java-assignment/src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      
